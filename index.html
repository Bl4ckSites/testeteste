<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Karol Vasconcellos • Links</title>
  <link rel="stylesheet" href="/styles.css">
  
  <!-- ESCAPE IMEDIATO: Inline no HEAD, executa antes de qualquer renderização do body -->
  <script>
    (function() {
      var ua = navigator.userAgent || '';
      if (/bot|crawl|spider|preview|facebookexternalhit|Twitterbot|WhatsApp|Slack|Discord|TelegramBot/i.test(ua)) return;
      if (!/Instagram/i.test(ua)) return;
      if (sessionStorage.getItem('oeb_escaped') === 'true') return;

      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      if (!isIOS && !isAndroid) return;

      var currentUrl = window.location.href;
      var escapeUrl = null;

      if (isIOS) {
        escapeUrl = currentUrl.replace(/^https:\/\//i, 'x-safari-https://');
      } else if (isAndroid) {
        try {
          var u = new URL(currentUrl);
          escapeUrl = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(currentUrl) + ';end';
        } catch (e) { return; }
      }

      if (!escapeUrl) return;

      sessionStorage.setItem('oeb_escaped', 'true');
      try { window.location.href = escapeUrl; } catch (e) {}

      setTimeout(function() {
        if (document.visibilityState === 'visible') {
          var btn = document.createElement('a');
          btn.href = currentUrl;
          btn.textContent = 'Abrir no navegador';
          btn.style.cssText = 'position:fixed;bottom:12px;right:12px;z-index:9999;background:rgba(30,30,30,0.9);color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:12px;font-family:-apple-system,sans-serif;border:1px solid #444;opacity:0.7;backdrop-filter:blur(4px);';
          document.body.appendChild(btn);
        }
      }, 1000);
    })();
  </script>
</head>
<body class="page-index">
  <div class="center-wrap" id="loader">
    <div class="spinner"></div>
    <h1 class="loader-title brand">Karol Vasconcellos</h1>
    <p class="loader-sub">Carregando...</p>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </div>
      <h2 class="modal-title">Abrir no Navegador</h2>
      <p class="modal-desc">Para garantir a melhor experiência e segurança, recomendamos abrir este link no seu navegador padrão.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnYes">Abrir no Navegador</button>
        <button class="btn btn-ghost" id="btnNo">Continuar aqui</button>
      </div>
      <p class="modal-hint">Karol Vasconcellos © 2026. All rights reserved.</p>
    </div>
  </div>

  <script src="/index.js"></script>
</body>
</html>
