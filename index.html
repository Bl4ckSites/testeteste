<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Karol Vasconcellos • Links</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="page-index">
  <div class="center-wrap" id="loader">
    <div class="spinner"></div>
    <h1 class="loader-title brand">Karol Vasconcellos</h1>
    <p class="loader-sub">Carregando...</p>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </div>
      <h2 class="modal-title">Abrir no Navegador</h2>
      <p class="modal-desc">Para garantir a melhor experiência e segurança, recomendamos abrir este link no seu navegador padrão.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnYes">Abrir no Navegador</button>
        <button class="btn btn-ghost" id="btnNo">Continuar aqui</button>
      </div>
      <p class="modal-hint">Karol Vasconcellos © 2026. All rights reserved.</p>
    </div>
  </div>

  <script src="/index.js"></script>
  <script defer src="/open-external.js"></script>
</body>
</html>
