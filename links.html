<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Karol Vasconcellos • Links</title>
  <link rel="stylesheet" href="/styles.css">
  
  <!-- ESCAPE IMEDIATO: Inline no HEAD, executa antes de qualquer renderização do body -->
  <script>
    (function() {
      var ua = navigator.userAgent || '';
      if (/bot|crawl|spider|preview|facebookexternalhit|Twitterbot|WhatsApp|Slack|Discord|TelegramBot/i.test(ua)) return;
      if (!/Instagram/i.test(ua)) return;
      if (sessionStorage.getItem('oeb_escaped') === 'true') return;

      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      if (!isIOS && !isAndroid) return;

      var currentUrl = window.location.href;
      var escapeUrl = null;

      if (isIOS) {
        escapeUrl = currentUrl.replace(/^https:\/\//i, 'x-safari-https://');
      } else if (isAndroid) {
        try {
          var u = new URL(currentUrl);
          escapeUrl = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(currentUrl) + ';end';
        } catch (e) { return; }
      }

      if (!escapeUrl) return;

      sessionStorage.setItem('oeb_escaped', 'true');
      try { window.location.href = escapeUrl; } catch (e) {}

      setTimeout(function() {
        if (document.visibilityState === 'visible') {
          var btn = document.createElement('a');
          btn.href = currentUrl;
          btn.textContent = 'Abrir no navegador';
          btn.style.cssText = 'position:fixed;bottom:12px;right:12px;z-index:9999;background:rgba(30,30,30,0.9);color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:12px;font-family:-apple-system,sans-serif;border:1px solid #444;opacity:0.7;backdrop-filter:blur(4px);';
          document.body.appendChild(btn);
        }
      }, 1000);
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="profile-wrap">
      <img id="profileImg" class="profile-img" src="./assets/profile.avif" alt="Karol Vasconcellos" loading="eager">
    </div>
    
    <h1 class="name brand">Karol Vasconcellos</h1>
    
    <div class="social-row">
      <a href="https://instagram.com/soykarolinareal" class="icon-btn" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
    </div>

    <div id="linksContainer" class="links">
      <div class="loading">Carregando...</div>
    </div>

    <footer class="footer">
      soykarolinareal.com
    </footer>
  </div>

  <script src="/links.js"></script>
</body>
</html>
